apiVersion: v1
kind: Pod
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  containers:
    - name: elasticsearch
      image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
      env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
      resources:
        limits:
          memory: "1536Mi"
        requests:
          memory: "1Gi"
      ports:
        - containerPort: 9200

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-svc
spec:
  selector:
    app: elasticsearch
  ports:
    - protocol: TCP
      port: 9200
      targetPort: 9200

---
apiVersion: v1
kind: Pod
metadata:
  name: apm-server
  labels:
    app: apm-server
spec:
  containers:
    - name: apm-server
      image: docker.elastic.co/apm/apm-server:9.5.5
      args:
        - "-e"
        - "-E"
        - "output.elasticsearch.hosts=[http://elasticsearch-svc:9200]"
        - "-E"
        - "apm-server.rum.enabled=true"
        - "-E"
        - "apm-server.otlp.enabled=true"
      resources:
        limits:
          memory: "512Mi"
        requests:
          memory: "256Mi"
      ports:
        - containerPort: 8200

---
apiVersion: v1
kind: Service
metadata:
  name: apm-server-svc
spec:
  selector:
    app: apm-server
  ports:
    - name: http
      protocol: TCP
      port: 8200
      targetPort: 8200

---
apiVersion: v1
kind: Pod
metadata:
  name: kibana
  labels:
    app: kibana
spec:
  containers:
    - name: kibana
      image: docker.elastic.co/kibana/kibana:9.5.5
      env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-svc:9200"
        - name: XPACK_APM_UI_ENABLED
          value: "true"
      resources:
        limits:
          memory: "1Gi"
        requests:
          memory: "512Mi"
      ports:
        - containerPort: 5601

---
apiVersion: v1
kind: Service
metadata:
  name: kibana-svc
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - protocol: TCP
      port: 5601
      targetPort: 5601
      nodePort: 30082
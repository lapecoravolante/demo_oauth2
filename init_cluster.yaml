kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: kyma

nodes:
  - role: control-plane

    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP

    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - 127.0.0.1
            - host.containers.internal

